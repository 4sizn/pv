# Local container template, not a validated relay topology. See ../README.md.
# The startup script injects a required secret; do not put it here.
listening-port=3478
fingerprint
use-auth-secret
realm=parentview.local
min-port=49160
max-port=49200
no-cli
no-multicast-peers
no-tls
no-dtls
log-file=stdout
simple-log
# A deployment must set external-ip when behind NAT and provide TLS certificates.
# A public deployment must deny private-network peer destinations explicitly.
# Never allow loopback peers on a public relay.
